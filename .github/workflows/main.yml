on:
  pull_request:
    branches:
      - main
      - master
      - prashant
  push:
    branches:
      - main
      - master
      - develop
      - prashant

name: "Build & Release"

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # 🟡 Step: Set app name based on branch
      - name: Set App Name
        run: |
          BRANCH=${GITHUB_REF##*/}
          echo "Current branch: $BRANCH"

          if [ "$BRANCH" = "main" ]; then
            APP_NAME="MyApp Main"
          elif [ "$BRANCH" = "develop" ]; then
            APP_NAME="MyApp Dev"
          elif [ "$BRANCH" = "prashant" ]; then
            APP_NAME="MyApp Prashant"
          else
            APP_NAME="MyApp"
          fi

          echo "Setting app name to: $APP_NAME"

          # 🧱 Update Android label
          sed -i '' "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" android/app/src/main/AndroidManifest.xml

          # 🧱 Update iOS Info.plist name
          /usr/libexec/PlistBuddy -c "Set :CFBundleName '$APP_NAME'" ios/Runner/Info.plist

          # 🧱 Update Web title
          sed -i '' "s|<title>.*</title>|<title>$APP_NAME</title>|" web/index.html

      # 🔧 Now build normally
      - run: flutter build apk --release --split-per-abi

      - run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload

      # 🚀 Upload to releases
      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/release/*,build/ios/iphoneos/app.ipa"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
